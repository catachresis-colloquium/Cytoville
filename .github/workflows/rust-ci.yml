# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Rust CI — compiles standalone scripts/*.rs utilities with -D warnings and
# runs cargo check/test/clippy when a Cargo.toml is present.
name: Rust CI

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-native:
    name: Windows Rust and Zig runtime boundary
    runs-on: windows-2025
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 60 || 20 }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install pinned Windows native tools
        shell: pwsh
        run: ./scripts/install-ci-native-windows.ps1

      - name: Exercise the native kernel through Rust on Windows
        shell: pwsh
        run: cargo test -p cytoville-runtime --release --test runtime --locked

      - name: Build the Windows client for local acceptance
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build -p cytoville-bevy --release --locked --jobs 2
          if ($LASTEXITCODE -ne 0) { throw 'Windows client build failed.' }
          $package = Join-Path $env:RUNNER_TEMP 'cytoville-windows'
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item -LiteralPath 'target/release/cytoville-bevy.exe' -Destination $package
          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $package 'COPYING')
          Copy-Item -LiteralPath 'assets/fonts/LICENCE.txt' -Destination (Join-Path $package 'FONT-LICENCE.txt')
          $revision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:GITHUB_SHA) { throw 'Source revision mismatch.' }
          $files = @('COPYING', 'FONT-LICENCE.txt', 'cytoville-bevy.exe') | ForEach-Object {
            [ordered]@{ name = $_; sha256 = (Get-FileHash -LiteralPath (Join-Path $package $_) -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          # Fixed ASCII string schema: lexical keys, compact UTF-8, no BOM/newline.
          # This receipt is JCS; it is not a general-purpose JSON canonicalizer.
          $receipt = [ordered]@{
            cargo_lock_sha256 = (Get-FileHash -LiteralPath 'Cargo.lock' -Algorithm SHA256).Hash.ToLowerInvariant()
            files = @($files)
            profile = 'release'
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            run_id = $env:GITHUB_RUN_ID
            scope = 'Build artifact for local acceptance; graphical playthrough and desktop latency remain unverified.'
            source_revision = $revision
            target = 'x86_64-pc-windows-msvc'
          } | ConvertTo-Json -Depth 4 -Compress
          [IO.File]::WriteAllText((Join-Path $package 'build-receipt.json'), $receipt, [Text.UTF8Encoding]::new($false))

      - name: Retain the Windows client and source receipt
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cytoville-windows-${{ github.sha }}
          path: ${{ runner.temp }}/cytoville-windows/
          if-no-files-found: error
          retention-days: 7

  acceptance:
    uses: ./.github/workflows/e2e.yml

  rust-ci:
    name: Rust standalone tools and workspace gate
    needs: [windows-native, acceptance]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require both native platforms and complete acceptance
        env:
          WINDOWS_RESULT: ${{ needs.windows-native.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: test "$WINDOWS_RESULT" = success && test "$ACCEPTANCE_RESULT" = success
